dqn:
  state_groups:
    - load
    - speed
    - soc
    - current_power
    - mpc_reference
    - tracking_error
  action_mode: discrete_increment
  mpc_weight_actions:
    q_soc_base: 6000.0
    q_fc_base: 0.001
    q_batt_base: 0.004
    q_ramp_base: 0.18
    dq_soc_values: [0.0, 2000.0, 4000.0, 6000.0]
    dq_fc_values: [-0.0003, 0.0, 0.0002]
    dq_batt_values: [0.0, 0.001, 0.002]
    dq_ramp_values: [0.0]
    eps: 1.0e-8
  reward_terms:
    - energy_norm
    - fc_dynamic_norm
    - soc_norm
    - battery_use_norm
  reward_weights:
    w1: 0.20
    w2: 0.30
    w3: 0.65
    w4: 0.20
    # Deprecated compatibility weights; accepted by the dataclass but not used
    # as independent terms in the clean four-group reward.
    w5: 0.00
    w6_battery_smooth: 0.00
    w7_soc_balance: 0.00
    w7_soc_boundary: 0.0
    w8_action_smooth: 0.0
    w9_soc_balance: 0.0
    w10_battery_balance: 0.0
  reward_defaults:
    soc_ref: 0.65
    soc_guard_low: 0.40
    soc_guard_high: 0.85
  control_correction:
    enforce_power_balance: true
    fc_soc_support_piecewise: false
    fc_soc_support_gain_kw: 0.0
    fc_soc_support_medium_gain_kw: 0.0
    fc_soc_support_deadband: 0.02
    fc_soc_support_start_soc: 0.65
    fc_soc_support_medium_start_soc: 0.60
    fc_soc_support_strong_start_soc: 0.55
    fc_soc_support_full_start_soc: 0.50
    fc_soc_support_light_max_kw: 0.0
    fc_soc_support_medium_max_kw: 0.0
    fc_soc_support_max_kw: 0.0
    fc_soc_support_hold_hysteresis_enabled: false
    fc_soc_support_hold_disable_soc: 0.60
    fc_soc_support_hold_reenable_soc: 0.58
    fc_soc_support_hold_scale: 0.0
    fc_soc_support_battery_need_aware: false
    prevent_high_soc_fc_surplus_charge: false
    fc_surplus_charge_guard_margin: 0.0
    fc_surplus_charge_guard_eps_kw: 0.1
    fuel_cell_allocator_mode: symmetric_total
    battery_allocator_mode: soft_balance
    battery_soc_balance_gain: 0.35
    battery_split_min: 0.30
    battery_split_max: 0.70
    soc_balance_deadband: 0.005
    soc_balance_bias_gain_kw_per_soc: 350.0
    max_balance_bias_kw: 8.0
    max_balance_bias_ratio: 0.08
    balance_bias_smoothing_alpha: 0.25
    balance_bias_rate_limit_kw_per_step: 2.0
    batt_ramp_kw_per_step: 360.0
    dominance_deadband_kw: 0.5
