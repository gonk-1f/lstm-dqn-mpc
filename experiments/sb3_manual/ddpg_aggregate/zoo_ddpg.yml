AggregateShipDDPG-v0:
  n_timesteps: 20000000  # 9258 steps/voyage * 500 = 4629000; episodes stop first
  policy: MlpPolicy
  n_envs: 1
  learning_rate: 0.001
  gamma: 1.0
  batch_size: 64
  buffer_size: 1000000
  learning_starts: 5000
  train_freq: 32
  gradient_steps: 1
  tau: 0.01
  noise_type: normal
  noise_std: 0.1
  policy_kwargs: "dict(net_arch=[128, 128])"
  env_kwargs:
    data_root: data/processed/operating_dataset_v6_1s
    split: train
    fixed_train_id: parent_005_seg01
  callback:
  - experiments.sb3_manual.ddpg_aggregate.fixed_train_eval.FixedTrainEvaluationCallback:
      every_episodes: 20
  - experiments.sb3_manual.ddpg_aggregate.periodic_validation.EpisodeValidationCallback:
      every_episodes: 100
      max_episodes: 500
  - stable_baselines3.common.callbacks.StopTrainingOnMaxEpisodes:
      max_episodes: 500
      verbose: 1
