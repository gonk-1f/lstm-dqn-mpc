AggregateShipDDPG-v0:
  n_timesteps: 500000
  policy: MlpPolicy
  n_envs: 1
  learning_rate: 0.001
  gamma: 0.999
  batch_size: 64
  buffer_size: 1000000
  learning_starts: 5000
  train_freq: 32
  gradient_steps: 1
  tau: 0.005
  noise_type: normal
  noise_std: 0.1
  policy_kwargs: "dict(net_arch=[256, 256])"
  env_kwargs:
    data_root: data/processed/operating_dataset_v6_1s
    split: train
  callback:
  - stable_baselines3.common.callbacks.StopTrainingOnMaxEpisodes:
      max_episodes: 484
      verbose: 1
