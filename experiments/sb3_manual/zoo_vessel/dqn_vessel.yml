VesselEnergy-v0:
  # The launcher requires an explicit n_timesteps; this is only a Zoo schema key.
  n_timesteps: 1024
  n_envs: 1
  policy: MlpPolicy
  learning_rate: 0.0001
  batch_size: 64
  buffer_size: 1000000
  learning_starts: 50000
  gamma: 1.0
  train_freq: 32
  gradient_steps: 1
  target_update_interval: 10000
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  exploration_fraction: 0.8
  optimize_memory_usage: false
  normalize: false
  policy_kwargs: 'dict(net_arch=[256, 256])'
