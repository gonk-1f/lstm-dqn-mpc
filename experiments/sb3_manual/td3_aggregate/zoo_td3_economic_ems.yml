AggregateShipTD3Economic-v0:
  n_timesteps: 6000000
  policy: MlpPolicy
  n_envs: 1
  learning_rate: 0.0001
  gamma: 1.0
  buffer_size: 1000000
  batch_size: 32
  tau: 0.001
  learning_starts: 10000
  train_freq: 32
  gradient_steps: 1
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  noise_type: normal
  noise_std: 0.05
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      qf: [256, 256]
  normalize: false
  env_kwargs:
    data_root: data/processed/operating_dataset_v6_1s
    split: train
    fixed_train_id: null
  callback:
  - experiments.sb3_manual.td3_aggregate.economic_ems_callbacks.EconomicEMSTrainingCallback:
      fixed_eval_every_episodes: 20
      validation_every_episodes: 100
      max_episodes: 500
      log_every_steps: 1000
  - stable_baselines3.common.callbacks.StopTrainingOnMaxEpisodes:
      max_episodes: 500
      verbose: 1
